<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210">
  <defs>
    <clipPath id="ballClip">
      <circle cx="100" cy="112" r="82"/>
    </clipPath>
    <path id="topArc" d="M 24,112 A 76,76 0 0,1 176,112"/>
  </defs>

  <!-- Basketball: black fill + white seams, clipped to circle -->
  <g clip-path="url(#ballClip)">
    <!-- Ball fill -->
    <circle cx="100" cy="112" r="82" fill="#000"/>
    <!-- Seam lines -->
    <line x1="100" y1="30" x2="100" y2="194" stroke="white" stroke-width="5.5"/>
    <line x1="18" y1="112" x2="182" y2="112" stroke="white" stroke-width="5.5"/>
    <path d="M40 57 Q72 84 100 112" stroke="white" stroke-width="5.5" fill="none"/>
    <path d="M160 57 Q128 84 100 112" stroke="white" stroke-width="5.5" fill="none"/>
    <path d="M40 167 Q72 140 100 112" stroke="white" stroke-width="5.5" fill="none"/>
    <path d="M160 167 Q128 140 100 112" stroke="white" stroke-width="5.5" fill="none"/>
    <!-- Three stripes (BOS) at bottom of ball -->
    <rect x="58" y="146" width="18" height="62" fill="white"/>
    <rect x="84" y="138" width="18" height="70" fill="white"/>
    <rect x="110" y="130" width="18" height="78" fill="white"/>
  </g>

  <!-- Outer circle border -->
  <circle cx="100" cy="112" r="82" fill="none" stroke="#000" stroke-width="2"/>

  <!-- "ADI SEL3CT" arc over the top -->
  <text
    font-family="'adidas FG Compressed', 'Barlow Condensed', 'Arial Narrow', sans-serif"
    font-size="23"
    font-weight="900"
    font-style="italic"
    fill="#000"
    letter-spacing="2.5"
    text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">ADI SEL3CT</textPath>
  </text>
</svg>
